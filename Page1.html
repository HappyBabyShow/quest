<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Задание 1.1</title>

  <!-- Подключаем старинный книжный шрифт с засечками -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ece8dc;
      padding: 24px;
      font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
    }

    /* Внешний контур карточки (имитация листа с пунктирной линией отреза) */
    .card-wrapper {
      padding: 12px;
      border: 1.5px dashed #8b929a;
      border-radius: 4px;
      background: #f7f4ec;
      box-shadow: 0 10px 30px rgba(18, 38, 70, 0.12);
      max-width: 680px;
      width: 100%;
    }

    /* Основная рамка в стиле португальского азулежу */
    .azulejo-card {
      position: relative;
      background: #FAF6EE;
      border: 14px solid #14427b; /* Фирменный кобальтово-синий цвет */
      box-shadow: inset 0 0 0 2px #FAF6EE, inset 0 0 0 4px #14427b;
      padding: 60px 45px 45px;
      text-align: center;
      color: #1a1a1a;
    }

    /* Верхний круглый медальон с номером */
    .badge {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 46px;
      height: 46px;
      background: #FAF6EE;
      border: 3px solid #14427b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #14427b;
      box-shadow: 0 0 0 3px #FAF6EE;
    }

    /* Тонкая внутренняя рамка */
    .inner-border {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1px solid rgba(20, 66, 123, 0.35);
      pointer-events: none;
    }

    /* Барочные декоративные уголки (SVG) */
    .corner {
      position: absolute;
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #14427b;
      stroke-width: 1.4;
      pointer-events: none;
      opacity: 0.85;
    }
    .corner-tl { top: 14px; left: 14px; }
    .corner-tr { top: 14px; right: 14px; transform: scaleX(-1); }
    .corner-bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
    .corner-br { bottom: 14px; right: 14px; transform: scale(-1, -1); }

    /* Декоративный разделитель */
    .divider {
      margin: 20px auto;
      width: 140px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #14427b;
      opacity: 0.4;
    }
    .divider span {
      color: #14427b;
      font-size: 0.9rem;
    }

    /* Стилизация текста задания */
    .task-pt {
      font-size: 1.65rem;
      font-weight: 600;
      line-height: 1.35;
      color: #12345d;
      letter-spacing: 0.2px;
    }

    .task-ru {
      font-size: 1.35rem;
      line-height: 1.4;
      color: #2b2b2b;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card-wrapper">
    <div class="azulejo-card">
      <!-- Медальон с номером -->
      <div class="badge">1</div>

      <!-- Внутренняя кайма и уголки -->
      <div class="inner-border"></div>

      <!-- Векторные виньетки по углам -->
      <svg class="corner corner-tl" viewBox="0 0 50 50">
        <path d="M 4 45 C 4 15 15 4 45 4 M 9 40 C 9 20 20 9 40 9 M 14 14 C 20 18 20 22 16 26 C 12 30 18 36 24 30" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="2.5" fill="#14427b"/>
      </svg>
      <svg class="corner corner-tr" viewBox="0 0 50 50">
        <path d="M 4 45 C 4 15 15 4 45 4 M 9 40 C 9 20 20 9 40 9 M 14 14 C 20 18 20 22 16 26 C 12 30 18 36 24 30" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="2.5" fill="#14427b"/>
      </svg>
      <svg class="corner corner-bl" viewBox="0 0 50 50">
        <path d="M 4 45 C 4 15 15 4 45 4 M 9 40 C 9 20 20 9 40 9 M 14 14 C 20 18 20 22 16 26 C 12 30 18 36 24 30" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="2.5" fill="#14427b"/>
      </svg>
      <svg class="corner corner-br" viewBox="0 0 50 50">
        <path d="M 4 45 C 4 15 15 4 45 4 M 9 40 C 9 20 20 9 40 9 M 14 14 C 20 18 20 22 16 26 C 12 30 18 36 24 30" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="2.5" fill="#14427b"/>
      </svg>
      
      <p class="task-ru">Пропрыгай на одной ноге по кругу и крикни: «Я супергерой!»</p>
    </div>
  </div>

</body>
</html>
